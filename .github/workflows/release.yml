name: Prepare or publish Python release
on:
  pull_request:
    paths: ['.github/workflows/release.yml', 'scripts/**', 'pyproject.toml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Stable tag on main (required for publication; blank builds a candidate)'
        type: string
        default: ''
      publish:
        description: 'Publish after all checks and pypi environment approval'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test release guards
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate candidate or select tagged source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: |
          flags=()
          if [ "$REQUEST_PUBLISH" = true ]; then flags+=(--require-tag); fi
          python scripts/validate_release.py --tag="$RELEASE_TAG" "${flags[@]}" --checkout > release-info.json
      - run: python -m pip install '.[test]' build twine
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify installed wheel outside checkout
        working-directory: /tmp
        run: python -c 'from langchain_mailchannels import MailChannelsSendEmailTool'
      - run: sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-report
          path: |
            release-info.json
            SHA256SUMS
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && vars.PYPI_PUBLISHING_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-mailchannels
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish checked artifacts with PyPI attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
